[project]
name = "research-raidar"
version = "0.2.0"
requires-python = ">=3.13"
dependencies = [
    "aws-cdk-core>=1.204.0",
    "boto3-stubs~=1.42.78",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "arxiv>=4.0.0,<5",
    "lxml>=6.1.0,<7",
    "boto3>=1.34.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
pythonpath = ["lambda"]
